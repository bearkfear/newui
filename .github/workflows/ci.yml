name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, types, builds and package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: workspace
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: workspace/.node-version
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2.1.3
        with:
          bun-version-file: workspace/package.json

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build library and public declarations
        run: bun run build

      - name: Check lint, formatting and types
        run: bun run check

      - name: Build Storybook
        run: bun run build:storybook

      - name: Pack library and verify public exports
        run: bun run pack

      - name: Upload package for review
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: newui-package
          path: workspace/artifacts/newui-preview.tgz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
